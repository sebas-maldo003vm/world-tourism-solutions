# Database credentials come only from the process environment. No defaults.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10



spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#TEMPORAL

#spring.jpa.properties.hibernate.generate_statistics=true
#logging.level.org.hibernate.stat=DEBUG
#logging.level.org.hibernate.SQL=DEBUG

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=never

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Base64-encoded HMAC key, minimum 32 bytes. Required; the app will not start without it.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-millis=86400000

app.upload-dir=uploads
app.supabase.url=https://ojrjvornvjhvonwqdkkh.supabase.co
# Clave anonima publica de Supabase (la misma que VITE_SUPABASE_ANON_KEY).
app.supabase.anon-key=${SUPABASE_ANON_KEY:}
# Clave service_role. Solo en el servidor; no exponerla al frontend ni al repositorio.
app.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
